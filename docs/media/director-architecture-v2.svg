<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#52514e"/>
    </marker>
    <marker id="arrowO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#eb6834"/>
    </marker>
    <style>
      .box { fill: #ffffff; stroke: #c9c8c1; stroke-width: 1.5; }
      .nv { fill: #f1f8e9; stroke: #76b900; stroke-width: 2; }
      .eng { fill: #eef4fc; stroke: #2a78d6; stroke-width: 1.5; }
      .ppl { fill: #f6f5f1; stroke: #8b8a84; stroke-width: 1.5; stroke-dasharray: 4 3; }
      .t { font-size: 16px; fill: #0b0b0b; font-weight: 700; }
      .s { font-size: 12.5px; fill: #52514e; }
      .l { stroke: #52514e; stroke-width: 1.6; fill: none; marker-end: url(#arrow); }
      .loop { stroke: #eb6834; stroke-width: 1.6; fill: none; stroke-dasharray: 5 4; marker-end: url(#arrowO); }
      .lt { font-size: 12px; fill: #b8441b; font-weight: 700; }
    </style>
  </defs>
  <rect width="1200" height="640" fill="#fcfcfb"/>
  <text x="32" y="42" font-size="22" font-weight="700" fill="#0b0b0b">Storyboard Studio Director v2: a Nemotron film crew that writes the film as code</text>
  <text x="32" y="66" class="s">Green = models on Nebius Token Factory (NVIDIA Nemotron Ultra · Super · Nano; an open VLM only looks) · Blue = the deterministic engine · Grey = people</text>

  <!-- row 1 -->
  <rect x="32" y="104" width="130" height="78" rx="12" class="box"/>
  <text x="97" y="138" text-anchor="middle" class="t">Story</text>
  <text x="97" y="158" text-anchor="middle" class="s">any language</text>

  <rect x="198" y="104" width="240" height="78" rx="12" class="nv"/>
  <text x="318" y="132" text-anchor="middle" class="t">Researcher · Nano + Tavily</text>
  <text x="318" y="152" text-anchor="middle" class="s">finds real places and customs,</text>
  <text x="318" y="168" text-anchor="middle" class="s">cited notes into the bible</text>

  <rect x="474" y="104" width="300" height="78" rx="12" class="nv"/>
  <text x="624" y="132" text-anchor="middle" class="t">Director · Ultra</text>
  <text x="624" y="152" text-anchor="middle" class="s">plans the shots and coverage, writes a</text>
  <text x="624" y="168" text-anchor="middle" class="s">cast &amp; set bible (strict JSON schema)</text>

  <rect x="810" y="104" width="358" height="78" rx="12" class="nv"/>
  <text x="989" y="132" text-anchor="middle" class="t">Cast · Super</text>
  <text x="989" y="152" text-anchor="middle" class="s">character kits + the hero object; the hero</text>
  <text x="989" y="168" text-anchor="middle" class="s">object is checked on its own by a VLM</text>

  <path d="M162 143 H194" class="l"/>
  <path d="M438 143 H470" class="l"/>
  <path d="M774 143 H806" class="l"/>
  <path d="M989 182 V214 H160 V250" class="l"/>

  <!-- row 2 -->
  <rect x="32" y="254" width="256" height="92" rx="12" class="nv"/>
  <text x="160" y="284" text-anchor="middle" class="t">Artist · Super</text>
  <text x="160" y="306" text-anchor="middle" class="s">writes every shot as SVG code,</text>
  <text x="160" y="322" text-anchor="middle" class="s">acting cues for the kit characters</text>

  <rect x="324" y="254" width="272" height="92" rx="12" class="eng"/>
  <text x="460" y="284" text-anchor="middle" class="t">Engine · render + measure</text>
  <text x="460" y="306" text-anchor="middle" class="s">validators, then measured gates:</text>
  <text x="460" y="322" text-anchor="middle" class="s">framing, size, faces, empty sets</text>

  <rect x="632" y="254" width="272" height="92" rx="12" class="nv"/>
  <text x="768" y="284" text-anchor="middle" class="t">Critic · VLM looks, Nano scores</text>
  <text x="768" y="306" text-anchor="middle" class="s">against the plan; a revision replaces</text>
  <text x="768" y="322" text-anchor="middle" class="s">a frame only when it scores higher</text>

  <rect x="940" y="254" width="228" height="92" rx="12" class="nv"/>
  <text x="1054" y="284" text-anchor="middle" class="t">Editor · Nano</text>
  <text x="1054" y="306" text-anchor="middle" class="s">timing, transitions,</text>
  <text x="1054" y="322" text-anchor="middle" class="s">reading speed</text>

  <path d="M288 300 H320" class="l"/>
  <path d="M596 300 H628" class="l"/>
  <path d="M904 300 H936" class="l"/>
  <path d="M460 346 V376 H200 V350" class="loop"/>
  <text x="330" y="394" text-anchor="middle" class="lt">a failed gate goes back as a measured fix</text>
  <path d="M768 346 V420 H120 V350" class="loop"/>
  <text x="560" y="438" text-anchor="middle" class="lt">score too low: revise the shot</text>

  <!-- row 3 -->
  <path d="M1054 346 V498 H860" class="l"/>
  <rect x="520" y="462" width="336" height="92" rx="12" class="eng"/>
  <text x="688" y="492" text-anchor="middle" class="t">Film</text>
  <text x="688" y="514" text-anchor="middle" class="s">acting, voices, dissolves, original score;</text>
  <text x="688" y="530" text-anchor="middle" class="s">MP4 + the full trace of every model call</text>

  <rect x="96" y="462" width="380" height="92" rx="12" class="ppl"/>
  <text x="286" y="492" text-anchor="middle" class="t">Publish gate</text>
  <text x="286" y="514" text-anchor="middle" class="s">every measured gate passes, then a</text>
  <text x="286" y="530" text-anchor="middle" class="s">by-eye checklist signed by owner + QC</text>
  <path d="M520 508 H480" class="l"/>

  <text x="32" y="600" class="s">Every model output passes the same validators a person's would (zod schemas → SVG sanitizer → engine schemas). A shot that still misses is redone on its own, on the same plan and cast.</text>
</svg>
